<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Pricing Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <p class="label">
    MOST POPULAR
  </p>
  
  <h2>
    Pro Developer Plan
  </h2>

  <p class="currency">
    <span class="price">$29</span>
    <span class="month">/ month</span>
  </p>

  <p class="discount-note">
    Save <span class="discount">20%</span> when billed annual.
    <span class="learn-more">Learn more</span> &gt;
  </p>

  <p class="feature-list">
    <span class="mark">&#10003;</span>
    <span class="github"> Unlimited GitHub Repositories.</span>
  </p>

  <button class="upgrade-to-pro-btn">
    Upgrade to Pro
  </button>
</body>
</html>
