<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand search & Dev Form Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="tech-logo" src="images/technology-logo.jpg" alt="Tech Logo">

    <input class="search-bar" type="text" placeholder="Search...">

    <h2 class="heading">Create Your Dev Account</h2>

    <p class="subtext">
        <span class="highlight"> Join 50,000+ IT students</span>
        building projects & advancing careers.
    </p>

    <input class="first-name" type="text" placeholder="First Name">

    <input class="last-name" type="text" placeholder="Last Name">

    <input class="email" type="text" placeholder="Email Address">

    <input class="password" type="text" placeholder="Password">

    <button class="sign-up-btn">
        Sign Up
    </button>
</body>
</html>
