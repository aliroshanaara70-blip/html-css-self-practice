<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Post Composer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input class="google-search" type="text" placeholder="Search posts or developers...">
    
    <p class="status">
        Posting as <span class="bold">@yourhandle</span> &#8226; Public
    </p>
    
    <img class="profile-picture" src="chibi-pfp.jpg" alt="Profile">

    <input class="composer-input" type="text" placeholder="What's on your mind?">

    <button class="post-btn">
        Post
    </button>
</body>
</html>
